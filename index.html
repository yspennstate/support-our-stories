<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Our Stories</title>
<meta name="description" content="If you enjoy our story and music videos, a one dollar donation helps us keep making them.">
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #1f1b16; --muted: #6b6258;
    --accent: #0b5cad; --accent-ink: #ffffff; --line: #e6dfd4; --soft: #eef4fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15130f; --card: #1f1c17; --ink: #f1ece4; --muted: #b3a998;
      --accent: #5aa2ec; --accent-ink: #0d1a28; --line: #352f27; --soft: #1b2733;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.55 Georgia, "Times New Roman", serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  main {
    width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 32px 26px 26px; text-align: center;
  }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 12px; font-weight: normal; }
  p { margin: 0 0 22px; color: var(--muted); }
  .amounts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  a.btn {
    display: block; text-decoration: none; border-radius: 10px; padding: 16px 10px;
    font: 600 20px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--accent); color: var(--accent-ink); border: 2px solid var(--accent);
  }
  a.btn.other { background: var(--soft); color: var(--ink); border-color: var(--line); font-size: 17px; }
  a.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .how { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--muted); margin: 18px 0 0; }
  .thanks { font-style: italic; margin: 22px 0 0; color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>Thank you for watching</h1>
  <p>We make story and music videos. If you enjoyed one, a one dollar donation helps us keep going.</p>
  <div class="amounts">
    <a class="btn" data-k="click1" href="https://www.paypal.com/donate/?cmd=_donations&amp;business=yitzchak.shmalo%40gmail.com&amp;currency_code=USD&amp;no_recurring=1&amp;item_name=Support%20our%20stories&amp;amount=1">$1</a>
    <a class="btn" data-k="click5" href="https://www.paypal.com/donate/?cmd=_donations&amp;business=yitzchak.shmalo%40gmail.com&amp;currency_code=USD&amp;no_recurring=1&amp;item_name=Support%20our%20stories&amp;amount=5">$5</a>
  </div>
  <a class="btn other" data-k="clickcustom" href="https://www.paypal.com/donate/?cmd=_donations&amp;business=yitzchak.shmalo%40gmail.com&amp;currency_code=USD&amp;no_recurring=1&amp;item_name=Support%20our%20stories">Choose your own amount</a>
  <div class="how">Payments go through PayPal. You can pay with a PayPal account or with a debit or credit card, no account needed.</div>
  <div class="thanks">Every dollar helps. Thank you.</div>
</main>
<script>
  // Count visits and button taps on a free public counter (no cookies, nothing personal is sent).
  var NS = "https://abacus.jasoncameron.dev/hit/supportourstories-yt/";
  try { fetch(NS + "visits", { mode: "cors", keepalive: true }).catch(function () {}); } catch (e) {}
  document.querySelectorAll("a[data-k]").forEach(function (a) {
    a.addEventListener("click", function () {
      try { fetch(NS + a.getAttribute("data-k"), { mode: "cors", keepalive: true }).catch(function () {}); } catch (e) {}
    });
  });
</script>
</body>
</html>
